name: Construir paquetes Windows y Linux de Escritor Automático

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - master
      - beta/v1.0.2
    tags:
      - 'v*'
      
permissions:
  contents: read

concurrency:
  group: build-escritor-automatico-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows-installer:
    name: Compilar instalador de Windows x64
    runs-on: windows-2022
    timeout-minutes: 60

    steps:
      - name: Descargar el código del repositorio
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Preparar Python 3.12 x64
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          architecture: x64

      - name: Configurar el actualizador y validar la versión
        shell: pwsh
        run: |
          $version = (Get-Content version.json -Raw | ConvertFrom-Json).version
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$version") {
            throw "La etiqueta $env:GITHUB_REF_NAME no coincide con version.json (v$version)."
          }
          py -3.12 -c "import json, os; json.dump({'repository': os.environ['GITHUB_REPOSITORY']}, open('update_config.json', 'w', encoding='utf-8'), indent=2)"
          Write-Host "Repositorio de actualizaciones: $env:GITHUB_REPOSITORY"
          Write-Host "Versión de la aplicación: $version"

      - name: Instalar Inno Setup 6.7.1 (versión fijada)
        shell: pwsh
        run: choco install innosetup --version=6.7.1 --yes --no-progress

      - name: Verificar herramientas de compilación
        shell: cmd
        run: |
          py -3.12 --version
          if errorlevel 1 exit /b 1
          if not exist "%ProgramFiles(x86)%\Inno Setup 6\ISCC.exe" exit /b 1

      - name: Instalar dependencia Ed25519 para las pruebas
        shell: pwsh
        run: |
          # Las pruebas se ejecutan antes de CREAR_INSTALADOR.bat, que crea su propio
          # entorno virtual e instala requirements.txt. Por eso se instala aquí la
          # dependencia criptográfica fijada que necesita la verificación Ed25519.
          py -3.12 -m pip install --disable-pip-version-check --only-binary=:all: "cryptography==50.0.2"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          py -3.12 -c "from cryptography.hazmat.primitives.asymmetric.ed25519 import Ed25519PublicKey; print('Ed25519 disponible:', Ed25519PublicKey.__name__)"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Probar lógica del actualizador
        shell: cmd
        run: py -3.12 -m unittest discover -s tests -v

      - name: Auditar dependencias declaradas
        shell: pwsh
        run: |
          py -3.12 -m pip install --disable-pip-version-check pip-audit
          py -3.12 -m pip_audit -r requirements.txt
          py -3.12 -m pip_audit -r requirements-build.txt
          New-Item -ItemType Directory -Force security-artifacts | Out-Null
          py -3.12 -m pip_audit -r requirements.txt --format cyclonedx-json --output security-artifacts/sbom-runtime.cdx.json
          py -3.12 -m pip_audit -r requirements-build.txt --format cyclonedx-json --output security-artifacts/sbom-build.cdx.json

      - name: Construir Escritor Automático y Setup.exe
        shell: cmd
        env:
          CI: 'true'
        run: call CREAR_INSTALADOR.bat

      - name: Verificar el instalador y calcular SHA-256
        shell: pwsh
        run: |
          $version = (Get-Content version.json -Raw | ConvertFrom-Json).version
          $fileName = "EscritorAutomatico-Setup-v$version.exe"
          $setup = Join-Path $env:GITHUB_WORKSPACE "dist-installer\$fileName"
          if (-not (Test-Path -LiteralPath $setup -PathType Leaf)) {
            throw "No se encontró el instalador esperado: $setup"
          }
          $hash = (Get-FileHash -LiteralPath $setup -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $fileName" | Set-Content -Encoding ascii (Join-Path $env:GITHUB_WORKSPACE 'dist-installer\SHA256SUMS.txt')
          Write-Host "SHA-256: $hash"
          if ((Get-Item -LiteralPath $setup).Length -lt 1000000) {
            throw 'El instalador es inusualmente pequeño. Se cancela la publicación del artefacto.'
          }

      - name: Subir instalador de Windows como artefacto
        uses: actions/upload-artifact@c2acdedd35a8824a1552c7137f8c18288c3ea469 # v7.0.2
        with:
          name: escritorio-automatico-windows-x64
          path: |
            dist-installer/EscritorAutomatico-Setup-v*.exe
            dist-installer/SHA256SUMS.txt
            security-artifacts/sbom-*.cdx.json
          if-no-files-found: error
          retention-days: 14

  build-linux-portable:
    name: Compilar paquete Linux x86_64
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Descargar el código del repositorio
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Preparar Python del sistema y Tkinter
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y python3.12 python3.12-venv python3-tk python3.12-dev build-essential tk-dev tcl-dev
          /usr/bin/python3.12 -c 'import tkinter, sys; print("Python", sys.version.split()[0], "Tk", tkinter.TkVersion)'

      - name: Configurar el actualizador y validar la versión
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(/usr/bin/python3.12 -c 'import json; print(json.load(open("version.json", encoding="utf-8"))["version"])')"
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" != "v$VERSION" ]]; then
            echo "La etiqueta $GITHUB_REF_NAME no coincide con version.json (v$VERSION)." >&2
            exit 1
          fi
          /usr/bin/python3.12 -c 'import json, os; json.dump({"repository": os.environ["GITHUB_REPOSITORY"]}, open("update_config.json", "w", encoding="utf-8"), indent=2)'
          echo "Repositorio de actualizaciones: $GITHUB_REPOSITORY"
          echo "Versión de la aplicación: $VERSION"

      - name: Probar lógica del actualizador
        run: /usr/bin/python3.12 -m unittest discover -s tests -v

      - name: Auditar dependencias declaradas
        run: |
          set -euo pipefail
          /usr/bin/python3.12 -m pip install --disable-pip-version-check pip-audit
          /usr/bin/python3.12 -m pip_audit -r requirements.txt
          /usr/bin/python3.12 -m pip_audit -r requirements-build.txt
          mkdir -p dist-linux
          /usr/bin/python3.12 -m pip_audit -r requirements.txt --format cyclonedx-json --output dist-linux/sbom-runtime.cdx.json
          /usr/bin/python3.12 -m pip_audit -r requirements-build.txt --format cyclonedx-json --output dist-linux/sbom-build.cdx.json

      - name: Verificar la configuración Linux
        run: /usr/bin/python3.12 preflight_linux.py

      - name: Crear entorno y comprobar dependencias
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3.12 -m venv .build_venv
          .build_venv/bin/python -m pip install --disable-pip-version-check --no-cache-dir --only-binary=:all: --upgrade 'pip==26.2.2'
          .build_venv/bin/python -m pip install --disable-pip-version-check --no-cache-dir --only-binary=:all: -r requirements-build.txt
          # evdev publica un sdist en Linux; se instala por separado, fijado y con SHA-256 verificado.
          .build_venv/bin/python -m pip install --disable-pip-version-check --no-cache-dir --no-build-isolation --no-deps --no-binary=:all: --require-hashes -r requirements-linux-source.txt
          # El resto se limita a wheels. pynput ve evdev==1.9.3 ya instalado en el entorno.
          .build_venv/bin/python -m pip install --disable-pip-version-check --no-cache-dir --only-binary=:all: -r requirements.txt
          .build_venv/bin/python -m pip check
          .build_venv/bin/python -m pip freeze > build-environment-linux.txt

      - name: Empaquetar aplicación Linux con PyInstaller
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(/usr/bin/python3.12 -c 'import json; print(json.load(open("version.json", encoding="utf-8"))["version"])')"
          # Las entradas --add-data son absolutas porque PyInstaller resuelve las rutas respecto al .spec.
          .build_venv/bin/python -m PyInstaller \
            --noconfirm --clean --windowed --onedir --contents-directory . \
            --name EscritorAutomatico --distpath dist --workpath build/pyinstaller-linux --specpath build/spec-linux \
            --add-data "$GITHUB_WORKSPACE/web_extension:web_extension" \
            --add-data "$GITHUB_WORKSPACE/LEEME.txt:." \
            --add-data "$GITHUB_WORKSPACE/INFORME_SEGURIDAD.md:." \
            --add-data "$GITHUB_WORKSPACE/version.json:." \
            --add-data "$GITHUB_WORKSPACE/update_config.json:." \
            --collect-data docx --collect-all PIL --collect-all pynput --collect-all evdev --collect-all Xlib \
            --hidden-import websockets.sync.server --hidden-import docx.oxml.ns \
            --exclude-module win32com --exclude-module pythoncom --exclude-module pywintypes \
            escritor_automatico.py
          test -x dist/EscritorAutomatico/EscritorAutomatico
          test -f dist/EscritorAutomatico/web_extension/manifest.json
          test -f dist/EscritorAutomatico/update_config.json
          cp POST_INSTALACION_LINUX.txt dist/EscritorAutomatico/POST_INSTALACION.txt
          cp LEEME_LINUX.txt dist/EscritorAutomatico/LEEME_LINUX.txt
          mkdir -p dist-linux/package
          cp -aL dist/EscritorAutomatico dist-linux/package/
          cp instalar_escritor_automatico_linux.sh dist-linux/package/
          chmod +x dist-linux/package/instalar_escritor_automatico_linux.sh
          tar -czf "dist-linux/EscritorAutomatico-v${VERSION}-linux-x86_64.tar.gz" -C dist-linux/package .
          sha256sum "dist-linux/EscritorAutomatico-v${VERSION}-linux-x86_64.tar.gz" > dist-linux/SHA256SUMS-LINUX.txt

      - name: Subir paquete Linux como artefacto
        uses: actions/upload-artifact@c2acdedd35a8824a1552c7137f8c18288c3ea469 # v7.0.2
        with:
          name: escritorio-automatico-linux-x86_64
          path: |
            dist-linux/EscritorAutomatico-v*-linux-x86_64.tar.gz
            dist-linux/SHA256SUMS-LINUX.txt
            dist-linux/sbom-*.cdx.json
          if-no-files-found: error
          retention-days: 14

  publish-release:
    name: Publicar GitHub Release con instaladores
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs:
      - build-windows-installer
      - build-linux-portable
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Descargar el código etiquetado
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Preparar Python para firmar la Release
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Descargar instalador de Windows
        uses: actions/download-artifact@0d2ec9d4cbcefe257d822f108de2a1f15f8da9f6 # v7.0.0
        with:
          name: escritorio-automatico-windows-x64
          path: release-assets/windows

      - name: Descargar paquete Linux
        uses: actions/download-artifact@0d2ec9d4cbcefe257d822f108de2a1f15f8da9f6 # v7.0.0
        with:
          name: escritorio-automatico-linux-x86_64
          path: release-assets/linux

      - name: Preparar archivos de la Release
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(python3 -c 'import json; print(json.load(open("version.json", encoding="utf-8"))["version"])')"
          [[ "$GITHUB_REF_NAME" == "v$VERSION" ]] || { echo "Etiqueta y version.json no coinciden" >&2; exit 1; }
          mkdir -p release-assets/final
          cp "release-assets/windows/EscritorAutomatico-Setup-v${VERSION}.exe" release-assets/final/
          cp "release-assets/linux/EscritorAutomatico-v${VERSION}-linux-x86_64.tar.gz" release-assets/final/
          cp release-assets/windows/sbom-runtime.cdx.json release-assets/final/
          cp release-assets/windows/sbom-build.cdx.json release-assets/final/
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZIP_DEFLATED, ZipFile
          source = Path("web_extension")
          import json
          version = json.loads(Path("version.json").read_text(encoding="utf-8"))["version"]
          destination = Path("release-assets/final") / f"EscritorAutomatico-WebExtension-v{version}.zip"
          with ZipFile(destination, "w", compression=ZIP_DEFLATED, compresslevel=9) as archive:
              for file in sorted(source.rglob("*")):
                  if file.is_file():
                      archive.write(file, file.as_posix())
          PY
          (cd release-assets/final && sha256sum \
            "EscritorAutomatico-Setup-v${VERSION}.exe" \
            "EscritorAutomatico-v${VERSION}-linux-x86_64.tar.gz" \
            "EscritorAutomatico-WebExtension-v${VERSION}.zip" \
            sbom-runtime.cdx.json sbom-build.cdx.json > SHA256SUMS.txt)
          cat release-assets/final/SHA256SUMS.txt

      - name: Firmar el manifiesto SHA-256 con Ed25519
        env:
          UPDATE_SIGNING_PRIVATE_KEY_B64: ${{ secrets.UPDATE_SIGNING_PRIVATE_KEY_B64 }}
        run: |
          python -m pip install --disable-pip-version-check --only-binary=:all: 'cryptography==50.0.2'
          python tools/sign_release_manifest.py release-assets/final/SHA256SUMS.txt release-assets/final/SHA256SUMS.txt.sig

      - name: Crear Release y adjuntar instaladores verificados
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          assets=(release-assets/final/EscritorAutomatico-Setup-v*.exe release-assets/final/EscritorAutomatico-v*-linux-x86_64.tar.gz release-assets/final/EscritorAutomatico-WebExtension-v*.zip release-assets/final/SHA256SUMS.txt release-assets/final/SHA256SUMS.txt.sig release-assets/final/sbom-*.cdx.json)
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "La Release $GITHUB_REF_NAME ya existe. No se sobrescriben assets publicados; crea una nueva etiqueta para publicar otra compilación." >&2
            exit 1
          else
            gh release create "$GITHUB_REF_NAME" "${assets[@]}" \
              --verify-tag \
              --title "Escritor Automático $GITHUB_REF_NAME" \
              --generate-notes
          fi
